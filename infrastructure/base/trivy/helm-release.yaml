---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: trivy
  chart:
    spec:
      version: 0.34.x
      chart: trivy-operator
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
      interval: 60m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    excludeNamespaces: "kube-system"
    serviceMonitor:
      enabled: true
      interval: 60s
    trivy:
      ignoreUnfixed: true
      # Use in-memory cache instead of the default BoltDB filesystem cache.
      configFile:
        cache:
          backend: memory
      # Must be >= operator.scanJobTimeout, otherwise trivy gives up before the
      # job deadline and the failure is reported as a scan error rather than a
      # timeout.
      timeout: 10m0s
      # Each scan job downloads the ~104 MiB vulnerability DB and, because the
      # cache backend is in-memory, holds it decompressed in RAM alongside the
      # scan working set. 256Mi was not enough for larger images and they were
      # being OOMKilled.
      # No CPU limit: scan containers sat pinned at the 100m limit and throttled
      # 100% of the time, which is what made scans run 138-235s against the job
      # deadline. Memory request stays below the limit deliberately - these are
      # short-lived and up to 10 run concurrently, so reserving 1Gi each would
      # hold 10Gi cluster-wide for jobs that usually use well under 100Mi.
      resources:
        limits:
          # Explicit null, not omission: the chart defaults this to 500m, so
          # leaving it out still sets a limit. `with dig ... ""` skips the key
          # when it is null, which is the only way to have no CPU limit.
          cpu: null
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 256Mi
    operator:
      # Raised from the 5m default: because the cache backend is in-memory, every
      # scan job re-downloads the ~104 MiB vulnerability DB, so scans were running
      # at 138-235s against a 300s deadline and larger images tipped over it.
      # backoffLimit is 0, so a job that exceeds the deadline is never retried and
      # the workload silently ends up with no VulnerabilityReport.
      scanJobTimeout: 10m
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      configAuditScannerScanOnlyCurrentRevisions: true
      scanJobTTL: 10m
