---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: trivy
  chart:
    spec:
      version: 0.34.x
      chart: trivy-operator
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
      interval: 60m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    excludeNamespaces: "kube-system"
    serviceMonitor:
      enabled: true
      interval: 60s
    trivy:
      ignoreUnfixed: true
      # Use in-memory cache instead of the default BoltDB filesystem cache.
      configFile:
        cache:
          backend: memory
      # Must be >= operator.scanJobTimeout, otherwise trivy gives up before the
      # job deadline and the failure is reported as a scan error rather than a
      # timeout.
      timeout: 10m0s
      # Each scan job downloads the vulnerability DB and, because the cache
      # backend is in-memory, holds it decompressed in RAM alongside the scan
      # working set, so the limit is sized for that rather than for idle use.
      # No CPU limit: a low limit throttled the scan containers and pushed them
      # towards the job deadline. The memory request stays below the limit
      # deliberately - these are short-lived and several run at once, so
      # reserving the full limit for each would tie up far more than they use.
      resources:
        limits:
          # Explicit null, not omission: the chart defaults this to 500m, so
          # leaving it out still sets a limit. `with dig ... ""` skips the key
          # when it is null, which is the only way to have no CPU limit.
          cpu: null
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 256Mi
    operator:
      # Raised from the 5m default: with an in-memory cache every scan job
      # re-downloads the vulnerability DB, and larger images did not finish in
      # time. backoffLimit is 0, so the deadline needs headroom - do not lower
      # it without checking scan durations first.
      scanJobTimeout: 10m
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      configAuditScannerScanOnlyCurrentRevisions: true
      scanJobTTL: 10m
      # Scan jobs are I/O heavy on the node filesystem, so they are capped and
      # spread rather than left to pile up.
      scanJobsConcurrentLimit: 6
    trivyOperator:
      # The limit above is cluster-wide and does not bound how many share a node,
      # so spread them too. Preferred rather than required: a hard rule can leave
      # jobs Pending, which the deadline above does not tolerate.
      scanJobAffinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/managed-by: trivy-operator
