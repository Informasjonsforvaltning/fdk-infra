---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres-connection-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    # Required for Prometheus to load these rules: the kube-prometheus-stack
    # Prometheus ruleSelector matches on this label. Without it the whole
    # PrometheusRule is silently ignored.
    release: monitoring-kube-prometheus-stack
spec:
  groups:
    - name: postgresql.connection.rules
      interval: 30s
      rules:
        # Alert when connection usage exceeds 80% of max_connections
        - alert: PostgreSQLHighConnectionUsage
          expr: |
            (
              sum(pg_stat_activity_count)
              /
              sum(pg_settings_max_connections)
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL connection usage is high ({{ $value | humanize }}%)"
            description: |
              PostgreSQL database is using {{ $value | humanize }}% of available connections.
              Current connections: {{ with query "sum(pg_stat_activity_count)" }}{{ . | first | value }}{{ end }}
              Max connections: {{ with query "sum(pg_settings_max_connections)" }}{{ . | first | value }}{{ end }}
              Consider investigating connection pooling or increasing max_connections.

        # Alert when connection usage exceeds 90% (critical)
        - alert: PostgreSQLCriticalConnectionUsage
          expr: |
            (
              sum(pg_stat_activity_count)
              /
              sum(pg_settings_max_connections)
            ) * 100 > 90
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL connection usage is critical ({{ $value | humanize }}%)"
            description: |
              PostgreSQL database is using {{ $value | humanize }}% of available connections.
              Current connections: {{ with query "sum(pg_stat_activity_count)" }}{{ . | first | value }}{{ end }}
              Max connections: {{ with query "sum(pg_settings_max_connections)" }}{{ . | first | value }}{{ end }}
              Database may start rejecting connections soon!

        # Alert when there are too many idle connections.
        # Expressed as a share of max_connections rather than an absolute count:
        # the two environments have different max_connections, and steady-state
        # idle is ~70 connections in both, which a fixed ">50" would flag as a
        # permanent fault.
        - alert: PostgreSQLTooManyIdleConnections
          expr: |
            (
              sum(pg_stat_activity_count{state="idle"})
              /
              sum(pg_settings_max_connections)
            ) * 100 > 60
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL has too many idle connections ({{ $value | humanize }}% of max)"
            description: |
              PostgreSQL idle connections are using {{ $value | humanize }}% of max_connections.
              Idle connections: {{ with query "sum(pg_stat_activity_count{state=\"idle\"})" }}{{ . | first | value }}{{ end }}
              This may indicate connection pooling issues or applications not closing connections properly.

        # Alert when there are connections stuck in "idle in transaction"
        - alert: PostgreSQLIdleInTransaction
          expr: |
            sum(pg_stat_activity_count{state="idle in transaction"}) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL has connections idle in transaction ({{ $value }})"
            description: |
              PostgreSQL has {{ $value }} connections that are idle in transaction.
              These connections hold locks and can cause performance issues.
              Investigate long-running transactions in your applications.

        # Alert when connections are blocked on locks.
        # Filtered to wait_event_type="Lock" specifically: every idle connection
        # reports wait_event_type="Client" (waiting on the client to send
        # something, which is normal), so a "wait_event_type != empty" filter
        # matches essentially every connection and fires permanently.
        - alert: PostgreSQLHighWaitingConnections
          expr: |
            sum(pg_stat_activity_count{wait_event_type="Lock"}) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL has many connections blocked on locks ({{ $value }})"
            description: |
              PostgreSQL has {{ $value }} connections waiting on locks.
              This indicates potential lock contention or slow queries.

        # Alert when database is down or unreachable.
        # The job label is the Service name, not the chart name - the
        # ServiceMonitor sets jobLabel to a label that is not present on the
        # Service, so Prometheus falls back to the Service name.
        - alert: PostgreSQLDown
          expr: |
            up{job="monitoring-prometheus-postgres-exporter"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL exporter is down or cannot reach database"
            description: |
              The PostgreSQL exporter cannot reach the database or is not running.
              Check database connectivity and exporter status.

        # Alert on high number of rollbacks (may indicate application issues)
        - alert: PostgreSQLHighRollbackRate
          expr: |
            rate(pg_stat_database_xact_rollback[5m]) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL has high transaction rollback rate"
            description: |
              Database {{ $labels.datname }} is experiencing {{ $value | humanize }} rollbacks per second.
              This may indicate application errors or constraint violations.

        # Alert on replication lag (if HA is enabled)
        - alert: PostgreSQLReplicationLag
          expr: |
            pg_replication_lag_seconds > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL replication lag is high ({{ $value }}s)"
            description: |
              PostgreSQL replica is lagging {{ $value }} seconds behind the master.
              This may impact read consistency for replicated queries.
