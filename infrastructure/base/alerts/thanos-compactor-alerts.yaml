---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: thanos-compactor-alerts
  namespace: monitoring
  labels:
    release: monitoring-kube-prometheus-stack
spec:
  groups:
    - name: thanos-compactor
      rules:
        # A halted compactor stops compaction AND retention, so blocks
        # accumulate indefinitely until object storage and the storegateway
        # disk fill up. It halts on the first bad block group and stays halted
        # until a human intervenes, so this needs to be noisy.
        - alert: ThanosCompactorHalted
          annotations:
            summary: Thanos compactor is halted
            description: >-
              The Thanos compactor has halted and is no longer compacting or
              applying retention. Blocks will accumulate until storage fills up.
              Check the compactor logs for the critical error that caused the
              halt.
          expr: thanos_compact_halted == 1
          for: 15m
          labels:
            severity: critical

        # Backstop in case the compactor stops making progress without setting
        # the halted flag (crashloop, stuck sync, wedged on object storage).
        - alert: ThanosCompactorNotRunning
          annotations:
            summary: Thanos compactor is not making progress
            description: >-
              There are blocks waiting to be compacted, but the Thanos compactor
              has not compacted, downsampled or cleaned anything in the last 6
              hours. Check the compactor logs.
          # Deliberately not based on thanos_compact_iterations_total: that only
          # increments on a fully completed pass, which can take days while a
          # large backlog is being worked through, so it reads as "not running"
          # precisely when the compactor is busiest. Progress plus pending work
          # is the honest signal. Both sides are aggregated so the label sets
          # match - group_compactions_total carries a resolution label that
          # todo_compactions does not, and `and` matches on labels.
          #
          # All three phases count as progress. The compactor runs compaction,
          # downsampling and retention cleanup in sequence, so while it works
          # through a downsample backlog no compaction completes for hours even
          # though todo_compactions is non-zero. Counting only compactions fired
          # a false positive in dev on 2026-08-14: 0 compactions in 6h, but 22
          # downsamples, 73 blocks cleaned and zero failures.
          #
          # `or vector(0)` on each term is load-bearing, not defensive padding.
          # sum() over a metric with no series returns an empty vector, and
          # adding anything to an empty vector yields empty - so one missing
          # counter would silently disable this alert instead of firing it.
          expr: >-
            (sum(increase(thanos_compact_group_compactions_total[6h])) or vector(0))
            + (sum(increase(thanos_compact_downsample_total[6h])) or vector(0))
            + (sum(increase(thanos_compact_blocks_cleaned_total[6h])) or vector(0))
            == 0
            and sum(thanos_compact_todo_compactions) > 0
          for: 30m
          labels:
            severity: warning

        # Early warning that retention is falling behind, before the disk
        # pressure shows up somewhere less obvious.
        - alert: ThanosCompactorDeletionBacklog
          annotations:
            summary: Thanos deletion backlog is not draining
            description: >-
              {{ $value }} blocks are marked for deletion and the backlog has
              not shrunk over the last 6h, so retention is not keeping up.
              Check whether the compactor is halted or wedged.
          # Deliberately not a plain threshold. Working through a large one-off
          # backlog is normal and can take days - it fired for a week straight
          # while retention was in fact draining thousands of blocks. A backlog
          # that is shrinking is healthy; only a flat or growing one is not.
          expr: >-
            thanos_compact_todo_deletion_blocks > 500
            and deriv(thanos_compact_todo_deletion_blocks[6h]) >= 0
          for: 1h
          labels:
            severity: warning
