---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: certificate-expiry-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    # Required by the Prometheus ruleSelector; without it the rules are ignored.
    release: monitoring-kube-prometheus-stack
spec:
  groups:
    - name: certificate.expiry.rules
      rules:
        # Source metric is the kubernetes-ingresses blackbox job, plus the
        # Probe for hosts served by a Gateway. A hostname is
        # probed once per scheme and once per ingress, so `instance` — the full
        # probe URL — holds several entries for the same certificate. Grouping
        # on the hostname pulled out of it collapses those into one alert.
        # `> 0` drops probes that saw no certificate.
        - alert: CertificateExpiringSoon
          expr: |
            min by (host) (
              label_replace(
                probe_ssl_earliest_cert_expiry > 0,
                "host", "$1", "instance", "https?://([^/]+).*"
              )
            ) - time() < 30 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: TLS certificate expires in less than 30 days
            description: >-
              The certificate served for {{ $labels.host }} expires in {{
              $value | humanizeDuration }}.
        - alert: CertificateExpiringCritical
          expr: |
            min by (host) (
              label_replace(
                probe_ssl_earliest_cert_expiry > 0,
                "host", "$1", "instance", "https?://([^/]+).*"
              )
            ) - time() < 10 * 24 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: TLS certificate expires in less than 10 days
            description: >-
              The certificate served for {{ $labels.host }} expires in {{
              $value | humanizeDuration }}. Clients will fail TLS verification
              when it does.
        # An expired or hostname-mismatched certificate fails the handshake, so
        # no certificate is reported and the expiry alerts above stay silent.
        # The probe cannot tell that from no answer (status code 0). The load
        # balancer answers even with the backend down, so 0 on every HTTPS probe
        # of a host means TLS failure, a missing load balancer frontend, DNS
        # failure or a response slower than the probe timeout.
        - alert: HTTPSNoResponse
          expr: |
            max by (host) (
              label_replace(
                probe_http_status_code{instance=~"https://.*"},
                "host", "$1", "instance", "https?://([^/]+).*"
              )
            ) == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: HTTPS host gives no response
            description: >-
              No HTTPS probe of {{ $labels.host }} has received a response for
              15 minutes. The certificate may be expired or not match the
              hostname, or the host does not answer.
