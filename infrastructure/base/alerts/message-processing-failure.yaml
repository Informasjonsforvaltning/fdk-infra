---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: message-processing-failure
  namespace: monitoring
  labels:
    release: monitoring-kube-prometheus-stack
spec:
  groups:
    - name: fdk
      rules:
        # The window must span several 30s scrapes, or increase() returns nothing.
        - alert: MessageProcessingFailure
          annotations:
            summary: Failed to process message
            description: >-
              {{ $labels.fdk_service }} in {{ $labels.namespace }} failed to
              process {{ $value | printf "%.0f" }} messages in the last 10 minutes.
          expr: |-
            sum by (namespace, fdk_service) (
              increase({__name__=~"processed_messages(_total)?", status="error"}[10m])
            ) > 0
          labels:
            severity: warning
