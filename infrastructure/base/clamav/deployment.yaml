---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  namespace: clamav
  labels:
    app: clamav
spec:
  replicas: 1
  # RollingUpdate keeps the existing pod serving while the new one loads its
  # signature DB (a multi-minute cold start), avoiding downtime on every rollout.
  # The cost is briefly running two ~2.5Gi pods, which is acceptable.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: clamav
  template:
    metadata:
      labels:
        app: clamav
    spec:
      containers:
        - name: clamav
          # Official ClamAV image; runs both clamd and freshclam. Pinned to the
          # 1.4 minor tag (tracks latest patch). The signatures emptyDir masks the
          # image's baked-in DB, so freshclam downloads a fresh copy on each cold
          # start; the startup probe below allows time for that before readiness.
          image: clamav/clamav:1.4
          ports:
            - name: clamd
              containerPort: 3310
              protocol: TCP
          # clamd must finish loading the signature DB before it accepts scans;
          # the startup probe allows up to ~5 min for that on a cold start.
          startupProbe:
            exec:
              command: ["clamdcheck.sh"]
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["clamdcheck.sh"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["clamdcheck.sh"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "2500Mi"
            limits:
              memory: "2500Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/clamav/clamd.conf
              subPath: clamd.conf
              readOnly: true
            - name: signatures
              mountPath: /var/lib/clamav
            - name: tmp
              mountPath: /tmp
          # The image's entrypoint must start as root to create and chown
          # /run/clamav and the signature DB dir; clamd then drops to the
          # unprivileged clamav user (uid 100) via the "User clamav" directive in
          # clamd.conf, so the long-running scanner is non-root. Only the caps
          # startup needs are kept: CHOWN/FOWNER/DAC_OVERRIDE to fix ownership,
          # SETUID/SETGID to drop privileges.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: clamav-config
        - name: signatures
          emptyDir:
            sizeLimit: 3Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
