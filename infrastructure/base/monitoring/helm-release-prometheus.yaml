---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: monitoring
  chart:
    spec:
      version: 88.x
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 60m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: Secret
      name: kube-prometheus-stack-alertmanager
      targetPath: alertmanager.config.global.slack_api_url
      valuesKey: slack-apiurl
    - kind: Secret
      name: kube-prometheus-stack-grafana
      targetPath: grafana.adminPassword
      valuesKey: password
  values:
    coreDns:
      enabled: false
    crds:
      upgradeJob:
        enabled: true
    kubeDns:
      enabled: true
    defaultRules:
      rules:
        kubeControllerManager: false
        kubeProxy: false
        kubeScheduler: false
      # Replaced by target-down-alerts.yaml, which names the affected targets.
      # Per-rule, so Watchdog and InfoInhibitor in the same group are unaffected.
      disabled:
        TargetDown: true
    # Disable control plane component monitoring (not available in managed GKE)
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - source.toolkit.fluxcd.io
            resources:
              - "*"
            verbs:
              - list
              - watch
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  kind: Kustomization
                  version: v1
                metricNamePrefix: gotk
                labelsFromPath: &gotkLabels
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                commonLabels:
                  kind: Kustomization
                  type: Ready
                metrics: &gotkMetrics
                  # StateSet over the Ready condition: one series per state with
                  # value 1 for the current state, so flux-alerts.yaml can match
                  # gotk_reconcile_condition{type="Ready",status="False"} == 1.
                  # StateSet path must resolve to the status string itself, and
                  # the constant "type" label comes from commonLabels (KSM cannot
                  # derive it once the path ends at a scalar).
                  - name: reconcile_condition
                    help: "The Ready condition status of a Flux resource."
                    each:
                      type: StateSet
                      stateSet:
                        labelName: status
                        path: [status, conditions, "[type=Ready]", status]
                        list: ["True", "False", "Unknown"]
                  - name: suspend_status
                    help: "The suspend status of a Flux resource."
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, suspend]
                        nilIsZero: true
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  kind: HelmRelease
                  version: v2
                metricNamePrefix: gotk
                labelsFromPath: *gotkLabels
                commonLabels:
                  kind: HelmRelease
                  type: Ready
                metrics: *gotkMetrics
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  kind: GitRepository
                  version: v1
                metricNamePrefix: gotk
                labelsFromPath: *gotkLabels
                commonLabels:
                  kind: GitRepository
                  type: Ready
                metrics: *gotkMetrics
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  kind: HelmRepository
                  version: v1
                metricNamePrefix: gotk
                labelsFromPath: *gotkLabels
                commonLabels:
                  kind: HelmRepository
                  type: Ready
                metrics: *gotkMetrics
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  kind: HelmChart
                  version: v1
                metricNamePrefix: gotk
                labelsFromPath: *gotkLabels
                commonLabels:
                  kind: HelmChart
                  type: Ready
                metrics: *gotkMetrics
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  kind: Bucket
                  version: v1
                metricNamePrefix: gotk
                labelsFromPath: *gotkLabels
                commonLabels:
                  kind: Bucket
                  type: Ready
                metrics: *gotkMetrics
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  kind: OCIRepository
                  version: v1
                metricNamePrefix: gotk
                labelsFromPath: *gotkLabels
                commonLabels:
                  kind: OCIRepository
                  type: Ready
                metrics: *gotkMetrics
    alertmanager:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      service:
        type: NodePort
      ingress:
        enabled: true
        annotations:
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/auth-type: basic
          nginx.ingress.kubernetes.io/auth-secret: ingress-basic-auth
          nginx.ingress.kubernetes.io/auth-realm: Authentication Required
      alertmanagerSpec:
        logLevel: debug
        alertmanagerConfigSelector:
          matchLabels:
            manager: default
      config:
        route:
          receiver: noop
          routes:
            - receiver: noop
              matchers:
                - alertname =~ "InfoInhibitor|Watchdog"
            - receiver: slack
              continue: false
              group_by: ["alertname"]
              group_wait: 10m
              group_interval: 30m
              repeat_interval: 72h
              matchers:
                - alertname = "ImageCriticalVulnerabilities"
            - receiver: slack
              continue: true
              # Grouped by alert and namespace, so several targets going down produce one
              # message listing them rather than one message each, and demo alerts stay
              # separate from staging. `...` meant group by every label, which is the same
              # as no grouping at all. group_wait is the window in which simultaneous
              # alerts collect into that one message.
              group_by: ["alertname", "namespace"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 8h
        receivers:
          - name: noop
          - name: slack
            slack_configs:
              - channel: ""
                send_resolved: true
                username: Alertmanager
                title: |
                  {{- if (index .Alerts 0).Annotations.summary -}}
                    {{ (index .Alerts 0).Annotations.summary }}
                  {{- else if .CommonLabels.alertname -}}
                    {{ .CommonLabels.alertname }}
                  {{- else -}}
                    Alert
                  {{- end -}}
                  {{- " " -}}
                  {{- if eq .CommonLabels.severity "critical" -}}
                    🔥🚽
                  {{- else if eq .CommonLabels.severity "error" -}}
                    ❌
                  {{- else if eq .CommonLabels.severity "warning" -}}
                    ⚠️
                  {{- else if eq .CommonLabels.severity "info" -}}
                    ℹ️
                  {{- else -}}
                    ❕
                  {{- end }}
                pretext: ""
                # A grouped alert lists one line per member; a single alert keeps the full
                # label detail. Repeating every label for each member of a large group is
                # what made these unreadable.
                text: |
                  {{- if gt (len .Alerts) 1 -}}
                    {{- range .Alerts -}}
                      {{- if .Annotations.description -}}
                        • {{ .Annotations.description }}
                      {{- else -}}
                        •{{ range .Labels.SortedPairs }}{{ if not (or (eq .Name "alertname") (eq .Name "namespace") (eq .Name "dashboard_url") (eq .Name "severity") (eq .Name "prometheus") (eq .Name "integration")) }} {{ .Name }}=`{{ .Value }}`{{ end }}{{ end }}
                      {{- end -}}
                      {{- "\n" -}}
                    {{- end -}}
                  {{- else -}}
                    {{- range .Alerts -}}
                      {{- if .Annotations.description -}}
                        > _{{ .Annotations.description }}_
                        {{- "\n" -}}
                      {{- end -}}
                      • alertname: `{{ .Labels.alertname }}`
                      {{- "\n" -}}
                      {{- range .Labels.SortedPairs -}}
                        {{- if not (or (eq .Name "alertname") (eq .Name "dashboard_url") (eq .Name "severity") (eq .Name "prometheus") (eq .Name "integration")) -}}
                          • {{ .Name }}: `{{ .Value }}`
                          {{- "\n" -}}
                        {{- end -}}
                      {{- end -}}
                    {{- end -}}
                  {{- end -}}
                icon_url: https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Prometheus_software_logo.svg/256px-Prometheus_software_logo.svg.png
                actions:
                  - type: button
                    text: "Query :mag:"
                    url: "{{ (index .Alerts 0).GeneratorURL }}"
                  - type: button
                    text: "Dashboard :chart_with_upwards_trend:"
                    url: "{{ (index .Alerts 0).Labels.dashboard_url }}"
                  - type: button
                    text: "Silence :no_bell:"
                    url: |
                      {{ .ExternalURL }}/#/silences/new?filter=%7B
                      {{- range .Alerts -}}
                        {{- range .Labels.SortedPairs -}}
                            {{- if (and (ne .Name "alertname") (ne .Name "dashboard_url")) -}}
                                {{- .Name }}%3D%22{{- .Value -}}%22%2C%20
                            {{- end -}}
                        {{- end -}}
                        alertname%3D%22{{- .Labels.alertname -}}%22%7D
                      {{- end -}}
    grafana:
      deploymentStrategy:
        type: Recreate
      sidecar:
        datasources:
          url: http://monitoring-thanos-query-frontend.monitoring:9090
          defaultDatasourceScrapeInterval: 5s
      service:
        type: NodePort
      serviceMonitor:
        scrapeTimeout: 10s
      ingress:
        enabled: true
        annotations:
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/server-snippet: |
            location /metrics {
              deny all;
              return 404;
            }
      persistence:
        enabled: true
        type: pvc
        size: 10Gi
    prometheus:
      enabled: true
      service:
        type: NodePort
      ingress:
        enabled: true
        annotations:
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/auth-type: basic
          nginx.ingress.kubernetes.io/auth-secret: ingress-basic-auth
          nginx.ingress.kubernetes.io/auth-realm: Authentication Required
      thanosService:
        enabled: true
      prometheusSpec:
        # Sized from a week of measured usage, with headroom above the peak.
        resources:
          requests:
            cpu: 300m
            memory: 4Gi
          limits:
            memory: 4Gi
        thanos:
          objectStorageConfig:
            existingSecret:
              key: objstore.yml
              name: thanos-objstore
        scrapeInterval: 30s
        scrapeTimeout: 10s
        # Allow Prometheus to discover all PodMonitors/ServiceMonitors within
        # its namespace, without applying label filtering.
        podMonitorSelector:
          matchLabels: null
        serviceMonitorSelector:
          matchLabels: null
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              resources:
                requests:
                  storage: 100Gi
        additionalScrapeConfigs:
          # Configure scraping of pods with 'prometheus.io/scrape' annotation 'true'.
          # 'prometheus.io/port' and 'prometheus.io/path' may be customized.
          - job_name: kubernetes-pods
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels:
                  - __meta_kubernetes_pod_annotation_prometheus_io_scrape
                action: keep
                regex: true
              - source_labels:
                  - __meta_kubernetes_pod_annotation_prometheus_io_path
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              - source_labels:
                  - __address__
                  - __meta_kubernetes_pod_annotation_prometheus_io_port
                action: replace
                regex: ([^:]+)(?::\d+)?;(\d+)
                replacement: $1:$2
                target_label: __address__
              # Drop targets that don't have a port (avoid duplicate discovery)
              - source_labels:
                  - __address__
                action: drop
                regex: '[^:]+'
              - action: labelmap
                regex: __meta_kubernetes_pod_label_(.+)
              - source_labels:
                  - __meta_kubernetes_namespace
                action: replace
                target_label: namespace
              - source_labels:
                  - __meta_kubernetes_pod_name
                action: replace
                target_label: kubernetes_pod_name
              - source_labels:
                  - __meta_kubernetes_pod_label_app
                action: replace
                regex: (.+)
                target_label: fdk_service
          # Use blackbox to gather metrics regarding ingresses.
          # Source: https://github.com/prometheus/prometheus/blob/c1b669bf9b0b1286ece53c977262089119783105/documentation/examples/prometheus-kubernetes.yml#L224-L260
          - job_name: kubernetes-ingresses
            scrape_interval: 1m
            metrics_path: /probe
            params:
              module:
                - http_2xx
            kubernetes_sd_configs:
              - role: ingress
            relabel_configs:
              # Keep only ingresses a probe target can be built from. A hostless
              # ingress leaves __param_target unset, and blackbox answers /probe
              # without a target with 400 Bad Request. Same regex as the rule
              # below so the two cannot drift apart.
              - source_labels:
                  - __meta_kubernetes_ingress_scheme
                  - __address__
                  - __meta_kubernetes_ingress_path
                regex: (.+);(.+);(.+?)\*?$
                action: keep
              - source_labels:
                  - __meta_kubernetes_ingress_scheme
                  - __address__
                  - __meta_kubernetes_ingress_path
                # Modfied from (.+);(.+);(.+) to remove trailing *
                regex: (.+);(.+);(.+?)\*?$
                replacement: ${1}://${2}${3}
                target_label: __param_target
              - target_label: __address__
                replacement: monitoring-blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
              - source_labels:
                  - __param_target
                target_label: instance
              - action: labelmap
                regex: __meta_kubernetes_ingress_label_(.+)
              - source_labels:
                  - __meta_kubernetes_namespace
                target_label: namespace
              - source_labels:
                  - __meta_kubernetes_ingress_name
                target_label: ingress
