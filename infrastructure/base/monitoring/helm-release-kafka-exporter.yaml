---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-kafka-exporter
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: monitoring
  chart:
    spec:
      version: 3.x
      chart: prometheus-kafka-exporter
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 60m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # Credentials come from the kafka-user-kafka-exporter Secret delivered by
    # External Secrets; the chart reads its username and password keys.
    sasl:
      enabled: true
      scram:
        enabled: true
        mechanism: scram-sha512
        secretName: kafka-user-kafka-exporter
    prometheus:
      serviceMonitor:
        enabled: true
        interval: 10s
