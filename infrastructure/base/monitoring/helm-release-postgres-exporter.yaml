---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-postgres-exporter
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: monitoring
  chart:
    spec:
      version: 8.x
      chart: prometheus-postgres-exporter
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 60m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    config:
      # Connection string from secret (keeps all connection details private)
      datasourceSecret:
        name: postgres-exporter
        key: DATA_SOURCE_NAME

      # Enable default metrics
      disableDefaultMetrics: false
      disableSettingsMetrics: false

    serviceMonitor:
      enabled: true
      interval: 30s

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      # No CPU limit on purpose. The exporter idles at ~3m and bursts briefly on
      # each scrape, so a quota it never approaches on average still throttled it
      # for ~27% of its runnable CFS periods. The request keeps its scheduling
      # share; the limit only added latency.
      limits:
        memory: 64Mi

    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      capabilities:
        drop:
          - ALL
