---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: monitoring
  # A cold storegateway resync legitimately takes longer than helm-controller's
  # 5m default, which made `helm upgrade --wait` time out and leave the release
  # Stalled with no retry (remediation defaults to 0 retries).
  timeout: 20m
  chart:
    spec:
      version: 0.48.0
      chart: thanos
      sourceRef:
        kind: HelmRepository
        name: thanos-community
      interval: 60m
  # No crds handling: Helm would apply the bundled kube-prometheus-stack
  # subchart's CRDs over the ones owned by our own release.
  upgrade:
    remediation:
      retries: 2
  values:
    global:
      serviceAccount:
        # Terraform annotates the per-component ServiceAccounts by name.
        perComponent: true
        create: false
      serviceMonitor:
        enabled: true
      # Our rules live in infrastructure/base/alerts.
      thanosRules:
        enabled: false
    receive:
      enabled: false
    query:
      replicaCount: 1
      endpoints:
        static:
          - dnssrv+_grpc._tcp.monitoring-kube-prometheus-thanos-discovery.monitoring.svc.cluster.local
      extraArgs:
        - --query.auto-downsampling
      resources:
        requests:
          memory: 300Mi
          cpu: 100m
    queryFrontend:
      enabled: true
      replicaCount: 1
      ingress:
        enabled: true
        className: nginx
        annotations:
          nginx.ingress.kubernetes.io/auth-type: basic
          nginx.ingress.kubernetes.io/auth-secret: ingress-basic-auth
          nginx.ingress.kubernetes.io/auth-realm: Authentication Required
      resources:
        requests:
          memory: 150Mi
          cpu: 100m
        limits:
          memory: 150Mi
    storegateway:
      replicaCount: 1
      persistence:
        size: 24Gi
      # A cold bucket sync takes longer than the chart's 5m startup budget.
      probes:
        startup:
          failureThreshold: 240
      ingress:
        http:
          enabled: true
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/auth-type: basic
            nginx.ingress.kubernetes.io/auth-secret: ingress-basic-auth
            nginx.ingress.kubernetes.io/auth-realm: Authentication Required
      resources:
        requests:
          memory: 2500Mi
          cpu: 150m
    compactor:
      # Would override the fixed requests below once the VPA CRD exists.
      vpa:
        enabled: false
      persistence:
        # Compaction needs roughly 2-3x the size of the largest block group as
        # scratch space. 24Gi was enough at rest but ran out mid-compaction
        # ("preallocate: no space left on device"), halting the compactor.
        size: 64Gi
      retention:
        resolutionRaw: 14d
        resolution5m: 30d
        resolution1h: 10y
      resources:
        requests:
          memory: 3Gi
          cpu: 100m
