---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: monitoring
  # A cold storegateway resync legitimately takes longer than helm-controller's
  # 5m default, which made `helm upgrade --wait` time out and leave the release
  # Stalled with no retry (remediation defaults to 0 retries).
  timeout: 20m
  chart:
    spec:
      version: 15.x
      chart: thanos
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
      interval: 60m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 2
  values:
    global:
      security:
        allowInsecureImages: true
    image:
      repository: bitnamilegacy/thanos
    existingObjstoreSecret: thanos-objstore
    # Without these, compaction failures are invisible: no component exposed
    # metrics and nothing alerted on thanos_compact_halted.
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    query:
      extraFlags:
        - --query.auto-downsampling
      dnsDiscovery:
        enabled: true
        sidecarsService: monitoring-kube-prometheus-thanos-discovery
        sidecarsNamespace: monitoring
      ingress:
        enabled: false
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/auth-type: basic
          nginx.ingress.kubernetes.io/auth-secret: ingress-basic-auth
          nginx.ingress.kubernetes.io/auth-realm: Authentication Required
      resources:
        requests:
          memory: 300Mi
          cpu: 100m
    queryFrontend:
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/auth-type: basic
          nginx.ingress.kubernetes.io/auth-secret: ingress-basic-auth
          nginx.ingress.kubernetes.io/auth-realm: Authentication Required
      resources:
        requests:
          memory: 150Mi
          cpu: 100m
        limits:
          memory: 150Mi
    storegateway:
      enabled: true
      persistence:
        size: 24Gi
      resources:
        requests:
          memory: 2500Mi
          cpu: 150m
      networkPolicy:
        enabled: false
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/auth-type: basic
          nginx.ingress.kubernetes.io/auth-secret: ingress-basic-auth
          nginx.ingress.kubernetes.io/auth-realm: Authentication Required
    compactor:
      enabled: true
      persistence:
        # Compaction needs roughly 2-3x the size of the largest block group as
        # scratch space. 24Gi was enough at rest but ran out mid-compaction
        # ("preallocate: no space left on device"), halting the compactor.
        size: 64Gi
      ingress:
        enabled: false
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/auth-type: basic
          nginx.ingress.kubernetes.io/auth-secret: ingress-basic-auth
          nginx.ingress.kubernetes.io/auth-realm: Authentication Required
      retentionResolutionRaw: 14d
      retentionResolution5m: 30d
      retentionResolution1h: 10y
      resources:
        requests:
          memory: 3Gi
          cpu: 100m
