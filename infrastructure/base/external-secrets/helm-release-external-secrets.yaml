---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  releaseName: external-secrets
  targetNamespace: external-secrets
  interval: 10m
  chart:
    spec:
      chart: external-secrets
      # Keep in lockstep with the GitRepository tag in repos-external-secrets.yaml,
      # which supplies the CRDs. Pinned to the minor rather than `2.x` so a future
      # major cannot land unreviewed.
      version: 2.8.x
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  values:
    installCRDs: false
    # The admission webhook sits in the write path for ExternalSecret and
    # SecretStore resources, so it needs more than one ready endpoint to survive
    # ordinary pod rescheduling. Two replicas plus a PDB keep one available.
    webhook:
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets-webhook
              app.kubernetes.io/instance: external-secrets
  install:
    createNamespace: true
