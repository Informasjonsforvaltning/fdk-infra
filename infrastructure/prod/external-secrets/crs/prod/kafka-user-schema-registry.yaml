---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-user-schema-registry
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kafka-user-schema-registry
    creationPolicy: Owner
    template:
      data:
        BROKERS: kafka-1:9094,kafka-2:9094,kafka-3:9094
        USERNAME: schema-registry
        PASSWORD: "{{ .password }}"
        SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="schema-registry" password="{{ .password }}";'
  data:
    - secretKey: password
      remoteRef:
        key: kafka-scram-users-prod
        property: schema-registry
