---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resource-identificators
  namespace: prod
spec:
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: resource-identificators
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: resource-identificators-prod
