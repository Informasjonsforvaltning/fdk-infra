---
# TLS material for the admin hosts.
# Delivered from Secret Manager as a kubernetes.io/tls Secret. Referenced from
# certificateRefs on the prod Gateway, so a renewal is a new Secret Manager
# version — no compute ssl-certificate and no Gateway change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-fdk-digdir-no-tls
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: admin-fdk-digdir-no-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .privatekey }}"
  data:
    - secretKey: certificate
      remoteRef:
        key: admin-fdk-digdir-no-tls-prod
        property: certificate
    - secretKey: privatekey
      remoteRef:
        key: admin-fdk-digdir-no-tls-prod
        property: private-key
