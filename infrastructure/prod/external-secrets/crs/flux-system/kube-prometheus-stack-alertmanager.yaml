---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kube-prometheus-stack-alertmanager
  namespace: flux-system
spec:
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kube-prometheus-stack-alertmanager
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: kube-prometheus-stack-alertmanager
