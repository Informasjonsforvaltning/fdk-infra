---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  namespace: monitoring
spec:
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: thanos-objstore
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: thanos-objstore
