# prune: disabled — Flux must never delete the loadbalancer frontend.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-demo-v4
  namespace: demo
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    networking.gke.io/v1beta1.FrontendConfig: demo-frontend-config
    ingress.gcp.kubernetes.io/pre-shared-cert: demo-fdk-digdir-no-ssl-2
    kubernetes.io/ingress.global-static-ip-name: digdir-fdk-dev-demo-v4
spec:
  rules:
    - host: registrering.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: fdk-nginx-registration
                port:
                  number: 8080
    - host: www.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: fdk-nginx-search
                port:
                  number: 8080
    - host: nap.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: fdk-nginx-search
                port:
                  number: 8080
    - host: concept-catalog.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: concept-catalog
                port:
                  number: 8080
    - host: sso.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: sso
                port:
                  number: 8080
    - host: admin.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: fdk-admin-gui
                port:
                  number: 8080
    - host: demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: fdk-nginx-search
                port:
                  number: 8080
    - host: organization-catalogue.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: organization-catalog
                port:
                  number: 8080
    - host: organization-catalog.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: organization-catalog
                port:
                  number: 8080
    - host: dataservice-catalog.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: fdk-nginx-dataservices
                port:
                  number: 8080
    - host: terms.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: terms-and-conditions
                port:
                  number: 8080
    - host: organization-bff.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: fdk-nginx-organization-bff
                port:
                  number: 8080
    - host: mqa-scoring-api.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: fdk-mqa-scoring-api
                port:
                  number: 8082
    - host: dataset-catalog.demo.fellesdatakatalog.digdir.no
      http:
        paths:
          - path: /*
