---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-user-fdk-parser-service
  namespace: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kafka-user-fdk-parser-service
    creationPolicy: Owner
    template:
      data:
        BROKERS: kafka-1:9094
        SECURITY_PROTOCOL: SASL_PLAINTEXT
        SASL_MECHANISM: SCRAM-SHA-512
        USERNAME: fdk-parser-service
        PASSWORD: "{{ .password }}"
        SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="fdk-parser-service" password="{{ .password }}";'
  data:
    - secretKey: password
      remoteRef:
        key: kafka-scram-users-staging
        property: fdk-parser-service
