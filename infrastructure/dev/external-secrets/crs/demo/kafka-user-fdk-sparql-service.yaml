---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-user-fdk-sparql-service
  namespace: demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kafka-user-fdk-sparql-service
    creationPolicy: Owner
    template:
      data:
        BROKERS: kafka-1:9094
        USERNAME: fdk-sparql-service
        PASSWORD: "{{ .password }}"
        SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="fdk-sparql-service" password="{{ .password }}";'
  data:
    - secretKey: password
      remoteRef:
        key: kafka-scram-users-demo
        property: fdk-sparql-service
