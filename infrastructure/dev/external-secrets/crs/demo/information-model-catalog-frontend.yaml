---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: information-model-catalog-frontend
  namespace: demo
spec:
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: information-model-catalog-frontend
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: information-model-catalog-frontend-demo
