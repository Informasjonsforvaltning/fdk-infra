---
# Key names follow the prometheus-kafka-exporter chart (sasl.scram.secretName).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-user-kafka-exporter
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kafka-user-kafka-exporter
    creationPolicy: Owner
    template:
      data:
        username: kafka-exporter
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: kafka-scram-users-staging
        property: kafka-exporter
