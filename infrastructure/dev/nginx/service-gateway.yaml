# Second Service for the controller. The chart's Service carries a BackendConfig
# annotation from the shared base, which a Gateway rejects.
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  namespace: nginx
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: nginx-nginx
    app.kubernetes.io/name: ingress-nginx
