---
# Staging values for the base exporter. The kustomization renames it to
# prometheus-kafka-exporter-staging after this patch is applied, so the
# release name, and with it the Prometheus job label, tells staging and demo
# apart.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-kafka-exporter
  namespace: flux-system
spec:
  values:
    kafkaServer:
      - kafka-1.staging:9094
    sasl:
      scram:
        secretName: kafka-user-kafka-exporter-staging
