---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/monitoring
  - helm-release-elasticsearch-exporter-demo.yaml
  - helm-release-elasticsearch-exporter-staging.yaml
  - helm-release-kafka-exporter-demo.yaml
patches:
  - path: helm-release-kafka-exporter-values.yaml
  # Must come after the values patch, which targets the base name.
  - patch: |-
      - op: replace
        path: /metadata/name
        value: prometheus-kafka-exporter-staging
    target:
      kind: HelmRelease
      name: prometheus-kafka-exporter
  - path: helm-release-prometheus-values.yaml
  - path: helm-release-thanos-values.yaml
  - path: karma.yaml
  - patch: |-
      - op: add
        path: /spec/values/alertmanager/config/receivers/1/slack_configs/0/channel
        value: fdk-dev-alerts
    target:
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: flux-system
