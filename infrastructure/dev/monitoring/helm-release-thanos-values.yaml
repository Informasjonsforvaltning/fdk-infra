---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
  namespace: flux-system
spec:
  values:
    queryFrontend:
      ingress:
        hosts:
          - host: thanos.dev.fellesdatakatalog.digdir.no
            paths:
              - path: /
                pathType: Prefix
    storegateway:
      ingress:
        http:
          hosts:
            - host: thanos-store.dev.fellesdatakatalog.digdir.no
              paths:
                - path: /
                  pathType: Prefix
