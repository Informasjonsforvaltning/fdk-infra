---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: fdk-nginx-community
    files:
      - nginx.conf
      - nginx-prod.conf
  - name: fdk-nginx-community-favicon
    files:
      - http-error/favicon.ico
  - name: fdk-nginx-community-maintenance
    files:
      - http-error/maintenance.html
