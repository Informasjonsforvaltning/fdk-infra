---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdk-nginx-community
  labels:
    fdk.service: fdk-nginx-community
spec:
  replicas: 1
  selector:
    matchLabels:
      fdk.service: fdk-nginx-community
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        fdk.service: fdk-nginx-community
    spec:
      containers:
        - name: fdk-nginx-community
          image: nginx:1.31.9-alpine
          env:
            - name: TZ
              value: Europe/Oslo
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 5
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: config
              subPath: nginx.conf
            - mountPath: /var/www/http-error/favicon.ico
              name: favicon
              subPath: favicon.ico
            - mountPath: /var/www/http-error/maintenance.html
              name: maintenance
              subPath: maintenance.html
      volumes:
        - name: config
          configMap:
            name: fdk-nginx-community
        - name: favicon
          configMap:
            name: fdk-nginx-community-favicon
        - name: maintenance
          configMap:
            name: fdk-nginx-community-maintenance
