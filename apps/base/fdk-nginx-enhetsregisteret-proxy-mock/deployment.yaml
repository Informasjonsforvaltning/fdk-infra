---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdk-nginx-enhetsregisteret-proxy-mock
  labels:
    fdk.service: fdk-nginx-enhetsregisteret-proxy-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      fdk.service: fdk-nginx-enhetsregisteret-proxy-mock
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        fdk.service: fdk-nginx-enhetsregisteret-proxy-mock
    spec:
      containers:
        - name: fdk-nginx-enhetsregisteret-proxy-mock
          image: nginx:1.31.9-alpine
          env:
            - name: TZ
              value: Europe/Oslo
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 32Mi
              cpu: 1m
            limits:
              memory: 32Mi
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: config
              subPath: nginx.conf
            - mountPath: /mockdata
              name: mockdata
            - mountPath: /mockdata-underenheter
              name: mockdata-underenheter
      volumes:
        - name: config
          configMap:
            name: fdk-nginx-enhetsregisteret-proxy-mock
        - name: mockdata
          configMap:
            name: fdk-nginx-enhetsregisteret-proxy-mock-mockdata
        - name: mockdata-underenheter
          configMap:
            name: fdk-nginx-enhetsregisteret-proxy-mock-mockdata-underenheter
