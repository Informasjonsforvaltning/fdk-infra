worker_processes auto;

events {
    use epoll;
    worker_connections 1024;
    multi_accept on;
}

http {
    server_tokens off;
    access_log off;

    map $http_x_forwarded_for $client_ip {
        # Default to $remote_addr if X-Forwarded-For is empty
        "" $remote_addr;
        # Extract the second to last IP
        ~^(?:[^,]+,)*([^,]+),[^,]+$ $1;
        # Use the only IP if there's just one
        ~^[^,]+$ $1;
    }
    limit_req_zone $client_ip zone=search_limit:10m rate=60r/s;
    limit_req_status 429;
    # Add headers for rate limiting
    add_header X-RateLimit-Limit 60 always;
    add_header X-RateLimit-Burst 120 always;
    add_header X-RateLimit-Delay 60 always;

    # nap.staging is the staging Transportportal host. ?transport=1 still flags
    # a request so unprefixed HTML details can be checked without that host.
    map $host $host_is_transportportal {
        default 0;
        nap.staging.fellesdatakatalog.digdir.no 1;
    }
    map $arg_transport $arg_is_transportportal {
        default 0;
        "1" 1;
    }
    map "$host_is_transportportal:$arg_is_transportportal" $is_transportportal {
        default 0;
        ~1 1;
    }
    # Unprefixed HTML details on a transportportal host stay on fdk-portal.
    # Locale-prefixed details are data-norge-frontend on every host.
    map $http_accept $is_html_accept {
        default 0;
        "~*text/html" 1;
    }
    map $uri $detail_has_locale {
        default 0;
        "~^/(nb|nn|en)/" 1;
    }
    map "$is_transportportal:$detail_has_locale:$is_html_accept" $html_detail_to_portal {
        default 0;
        "1:0:1" 1;
    }
    map $http_accept $rdf_accept_type {
        default "";
        "~*application/rdf\+xml"    "application/rdf+xml";
        "~*text/turtle"             "text/turtle";
        "~*application/ld\+json"    "application/ld+json";
        "~*application/n-triples"   "application/n-triples";
        "~*application/n-quads"     "application/n-quads";
        "~*application/trig"        "application/trig";
        "~*application/trix"        "application/trix";
        "~*application/rdf\+json"   "application/rdf+json";
        "~*text/n3"                 "text/n3";
    }
    map $http_accept $resource_accept_type {
        default "";
        "~*application/json"        "application/json";
    }

    map $http_accept $rss_atom_type {
        default "";
        "~*application/rss\+xml"    "application/rss+xml";
        "~*application/atom\+xml"   "application/atom+xml";
    }

    server {

        listen 8080;
        server_name default_server;
        port_in_redirect off;
        absolute_redirect off;
        # Use the mapped $client_ip
        set_real_ip_from 10.0.0.0/8;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        limit_req zone=search_limit burst=120 delay=60;

        set $cspNonce $request_id;
        set $csp_policy_fdk_portal "default-src 'self'; script-src 'self' https://siteimproveanalytics.com https://sparql.staging.fellesdatakatalog.digdir.no 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://altinncdn.no https://fonts.googleapis.com 'unsafe-inline'; object-src 'none'; base-uri 'self'; connect-src 'self' https://fellesdatakatalog.digdir.no https://*.fellesdatakatalog.digdir.no https://europe-north1-digdir-cloud-functions.cloudfunctions.net https://prefix.cc https://rdf.kartverket.no https://altinncdn.no https://fonts.googleapis.com; font-src 'self' https://altinncdn.no https://fonts.gstatic.com https://res-1.cdn.office.net; frame-src 'self' https://auth.staging.fellesdatakatalog.digdir.no https://auth.demo.fellesdatakatalog.digdir.no https://www.youtube.com; frame-ancestors 'self'; img-src 'self' https://cms.staging.fellesdatakatalog.digdir.no https://cms.fellesdatakatalog.digdir.no https://orglogo.difi.no https://orglogo.digdir.no https://6255470.global.siteimproveanalytics.io; manifest-src 'self'; media-src 'self'; worker-src 'none';";
        set $csp_policy_static_rdf "base-uri 'self'; default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://code.jquery.com https://siteimproveanalytics.com; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; frame-ancestors 'none';";
        set $csp_policy_data_norge "default-src 'self'; script-src 'self' 'nonce-$cspNonce' 'strict-dynamic' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://orglogo.digdir.no https://cache.kartverket.no https://6255470.global.siteimproveanalytics.io; font-src 'self'; connect-src 'self' https://fellesdatakatalog.digdir.no https://*.fellesdatakatalog.digdir.no https://aisearch.api.staging.fellesdatakatalog.digdir.no https://aisearch.api.demo.fellesdatakatalog.digdir.no; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self' https://www.youtube-nocookie.com; frame-ancestors 'none'; upgrade-insecure-requests;";

        # Only allow valid HTTP methods
        if ($request_method !~ ^(GET|POST|PUT|DELETE|HEAD|OPTIONS|PATCH)$) {
            return 405;
        }

        #remove www
        if ($host ~* '^www\.(.*)$') {
            return 301 https://$1$request_uri;
        }

        #remove all instances of trailing slashes
        rewrite ^/(.*)/$ /$1 permanent;

        proxy_http_version          1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout       600;
        proxy_send_timeout          600;
        proxy_read_timeout          600;
        send_timeout                600;

        client_max_body_size 50M;

        # Compression

        # Enable Gzip compressed.
        gzip on;

        # Enable compression both for HTTP/1.0 and HTTP/1.1.
        gzip_http_version  1.1;

        # Compression level (1-9).
        # 5 is a perfect compromise between size and cpu usage, offering about
        # 75% reduction for most ascii files (almost identical to level 9).
        gzip_comp_level    5;

        # Don't compress anything that's already small and unlikely to shrink much
        # if at all (the default is 20 bytes, which is bad as that usually leads to
        # larger files after gzipping).
        gzip_min_length    256;

        # Compress data even for clients that are connecting to us via proxies,
        # identified by the "Via" header (required for CloudFront).
        gzip_proxied       any;

        # Tell proxies to cache both the gzipped and regular version of a resource
        # whenever the client's Accept-Encoding capabilities header varies;
        # Avoids the issue where a non-gzip capable client (which is extremely rare
        # today) would display gibberish if their proxy gave them the gzipped version.
        gzip_vary          on;

        # Compress all output labeled with one of the following MIME-types.
        gzip_types
            application/atom+xml
            application/javascript
            application/json
            application/rss+xml
            application/x-font-ttf
            application/x-web-app-manifest+json
            application/xhtml+xml
            application/xml
            font/opentype
            image/svg+xml
            image/x-icon
            text/css
            text/plain
            text/x-component
            text/turtle;

        # Short term caching
        open_file_cache max=1000 inactive=20s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 5;
        open_file_cache_errors off;

        # Hide upstream HSTS so the client only sees ours. Cache-Control is intentionally
        # left passthrough at server level — APIs override it via api-headers.conf, and
        # any backend that emits its own Cache-Control (e.g. immutable for fingerprinted
        # assets) keeps it for web responses.
        proxy_hide_header Strict-Transport-Security;

        # Server-level default headers. nginx does not inherit add_header into locations
        # that declare their own, so any location below that uses add_header must also
        # `include dev-web-headers.conf;` (or dev-api-headers.conf) to keep this set in
        # effect — the dev-* variants bundle X-Robots-Tag for non-prod environments.
        include dev-web-headers.conf;

        location ~* /(health|prometheus|actuator)/* {
            return 404;
        }

        #redirect dataservices to data-services
        location ~* ^(/api|/nb|/nn|/en)?/dataservices(.*) {
            return 301 $1/data-services$2$is_args$args;
        }

        #redirect informationmodels to information-models
        location ~* ^(/api)?/informationmodels(.*) {
            return 301 $1/information-models$2$is_args$args;
        }

        location /api/apis {
            return 301 https://${host}/api/data-services;
        }

        location ~* ^/apis(.*) {
            return 301 https://${host}/data-services$1$is_args$args;
        }

        location /api/concepts {
            location ~* /api/concepts/.+ {
                if ($rdf_accept_type) {
                    rewrite /api/concepts(.*) /v1/concepts$1/graph break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($resource_accept_type) {
                    rewrite /api/concepts(.*) /v1/concepts$1 break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                return 303 https://${host}/concepts;
            }
            if ($rdf_accept_type) {
                rewrite /api/concepts(.*) /v1/concepts$1/graph break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite /api/concepts(.*) /v1/concepts$1 break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($http_accept ~* "text/html") {
                return 303 https://${host}/concepts;
            }
            return 303 https://concepts.${host}/collections;
        }

        location /api/data-services {
            location ~* /api/data-services/.+ {
                if ($rdf_accept_type) {
                    rewrite /api/data-services(.*) /v1/data-services$1/graph break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($resource_accept_type) {
                    rewrite /api/data-services(.*) /v1/data-services$1 break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                return 303 https://${host}/data-services;
            }
            if ($rdf_accept_type) {
                rewrite /api/data-services(.*) /v1/data-services$1/graph break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite /api/data-services(.*) /v1/data-services$1 break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($http_accept ~* "text/html") {
                return 303 https://${host}/data-services;
            }
            return 303 https://dataservices.${host}/catalogs;
        }

        location /api/dataset/preview {
            rewrite /dataset/preview(.*) /preview$1 break;
            proxy_pass http://fdk-dataset-preview-service:8080;
            include dev-api-headers.conf;
        }

        location /api/datasets {
            location ~* /api/datasets/.* {
                if ($rdf_accept_type) {
                    rewrite /api/datasets(.*) /v1/datasets$1/graph break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($resource_accept_type) {
                    rewrite /api/datasets(.*) /v1/datasets$1 break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                return 303 https://${host}/datasets;
            }
            if ($rdf_accept_type) {
                rewrite /api/datasets(.*) /v1/datasets$1/graph break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite /api/datasets(.*) /v1/datasets$1 break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($http_accept ~* "text/html") {
                return 303 https://${host}/datasets;
            }
            return 303 https://datasets.${host}/catalogs;
        }

        location /api/events {
            if ($rdf_accept_type) {
                rewrite /api/events(.*) /v1/events$1/graph break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite /api/events(.*) /v1/events$1 break;
                proxy_pass  http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            return 303 https://${host}/events;
        }

        location /api/information-models {
            location ~* /api/information-models/.* {
                if ($rdf_accept_type) {
                    rewrite /api/information-models(.*) /v1/information-models$1/graph break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($resource_accept_type) {
                    rewrite /api/information-models(.*) /v1/information-models$1 break;
                    proxy_pass  http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                return 303 https://${host}/information-models;
            }
            if ($rdf_accept_type) {
                rewrite /api/information-models(.*) /v1/information-models$1/graph break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite /api/information-models(.*) /v1/information-models$1 break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($http_accept ~* "text/html") {
                return 303 https://${host}/information-models;
            }
            return 303 https://informationmodels.${host}/catalogs;
        }

        location /api/public-services {
            if ($rdf_accept_type) {
                rewrite /api/public-services(.*) /v1/public-services$1/graph break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite /api/public-services(.*) /v1/public-services$1 break;
                proxy_pass  http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            return 303 https://${host}/public-services;
        }

        location /api {
            #data_norge
            proxy_set_header X-Nonce $cspNonce;
            proxy_set_header Content-Security-Policy $csp_policy_data_norge;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass http://data-norge-frontend:8080;
            add_header Content-Security-Policy $csp_policy_data_norge always;
            include dev-web-headers.conf;
        }

        location /concepts {
            location ~* /concepts/.+ {
                if ($rdf_accept_type) {
                    rewrite ^/concepts/([^/]+)$ /v1/concepts/$1/graph break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($resource_accept_type) {
                    rewrite ^/concepts/([^/]+)$ /v1/concepts/$1 break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($http_accept ~* "text/html") {
                    proxy_pass http://fdk-portal:8080;
                    add_header Content-Security-Policy $csp_policy_fdk_portal always;
                    include dev-web-headers.conf;
                }
            }
            if ($rdf_accept_type) {
                rewrite /concepts(.*) /v1/concepts$1/graph break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite /concepts(.*) /v1/concepts$1 break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            # Catalog root only. /concepts/{id} is the nested location and stays.
            # Query string is kept and not renamed.
            return 302 /nb/search/concepts$is_args$args;
        }

        location ~* ^(/(nb|nn|en))?/data-services {
            set $catalog_locale $1;
            location ~* ^(/(nb|nn|en))?/data-services/.+ {
                if ($rdf_accept_type) {
                    rewrite ^(/(nb|nn|en))?/data-services/([^/]+)$ /v1/data-services/$3/graph break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($resource_accept_type) {
                    rewrite ^(/(nb|nn|en))?/data-services/([^/]+)$ /v1/data-services/$3 break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($html_detail_to_portal = 1) {
                    proxy_pass http://fdk-portal:8080;
                    add_header Content-Security-Policy $csp_policy_fdk_portal always;
                    include dev-web-headers.conf;
                }
                #data_norge
                proxy_set_header X-Nonce $cspNonce;
                proxy_set_header Content-Security-Policy $csp_policy_data_norge;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $host;
                proxy_pass http://data-norge-frontend:8080;
                add_header Content-Security-Policy $csp_policy_data_norge always;
                include dev-web-headers.conf;
            }
            if ($rdf_accept_type) {
                rewrite /data-services(.*) /v1/data-services$1/graph break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite /data-services(.*) /v1/data-services$1 break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            # Catalog root only. A further segment is a detail page and stays.
            # /dataservices and /apis still alias here, then follow this redirect.
            if ($catalog_locale = "") {
                set $catalog_locale /nb;
            }
            return 302 $catalog_locale/search/data-services$is_args$args;
        }

        location = /data/rss.xml {
            proxy_set_header Accept "application/rss+xml";
            rewrite /data/rss.xml(.*) /$1 break;
            proxy_pass http://fdk-rss-atom-feed:8080;
            include dev-api-headers.conf;
        }

        location ^~ /datasets.rss {
            proxy_set_header Accept "application/rss+xml";
            rewrite /datasets.rss(.*) /$1 break;
            proxy_pass http://fdk-rss-atom-feed:8080;
            include dev-api-headers.conf;
        }

        location ^~ /datasets.atom {
            proxy_set_header Accept "application/atom+xml";
            rewrite /datasets.atom(.*) /$1 break;
            proxy_pass http://fdk-rss-atom-feed:8080;
            include dev-api-headers.conf;
        }

        location ~* ^(/(nb|nn|en))?/datasets {
            set $catalog_locale $1;
            location ~* ^(/(nb|nn|en))?/datasets/.+ {
                if ($rdf_accept_type) {
                    rewrite ^(/(nb|nn|en))?/datasets/([^/]+)$ /v1/datasets/$3/graph break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($resource_accept_type) {
                    rewrite ^(/(nb|nn|en))?/datasets/([^/]+)$ /v1/datasets/$3 break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($html_detail_to_portal = 1) {
                    proxy_pass http://fdk-portal:8080;
                    add_header Content-Security-Policy $csp_policy_fdk_portal always;
                    include dev-web-headers.conf;
                }
                #data_norge
                proxy_set_header X-Nonce $cspNonce;
                proxy_set_header Content-Security-Policy $csp_policy_data_norge;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $host;
                proxy_pass http://data-norge-frontend:8080;
                add_header Content-Security-Policy $csp_policy_data_norge always;
                include dev-web-headers.conf;
            }
            if ($rdf_accept_type) {
                rewrite /datasets(.*) /v1/datasets$1/graph break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite /datasets(.*) /v1/datasets$1 break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($rss_atom_type) {
                rewrite /datasets(.*) /$1 break;
                proxy_pass http://fdk-rss-atom-feed:8080;
                include dev-api-headers.conf;
            }

            # Catalog root only. A further segment is a detail page and stays.
            if ($catalog_locale = "") {
                set $catalog_locale /nb;
            }
            return 302 $catalog_locale/search/datasets$is_args$args;
        }

        location ~* ^(/(nb|nn|en))?/services {
            location ~* ^(/(nb|nn|en))?/services/.+ {
                if ($rdf_accept_type) {
                    rewrite ^(/(nb|nn|en))?/services/([^/]+)$ /v1/services/$3/graph break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($resource_accept_type) {
                    rewrite ^(/(nb|nn|en))?/services/([^/]+)$ /v1/services/$3 break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                #data_norge
                proxy_set_header X-Nonce $cspNonce;
                proxy_set_header Content-Security-Policy $csp_policy_data_norge;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $host;
                proxy_pass http://data-norge-frontend:8080;
                add_header Content-Security-Policy $csp_policy_data_norge always;
                include dev-web-headers.conf;
            }
            if ($rdf_accept_type) {
                rewrite /services(.*) /v1/services$1/graph break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite /services(.*) /v1/services$1 break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($rss_atom_type) {
                rewrite /services(.*) /$1 break;
                proxy_pass http://fdk-rss-atom-feed:8080;
                include dev-api-headers.conf;
            }

            #portal
            proxy_pass http://fdk-portal:8080;
            add_header Content-Security-Policy $csp_policy_fdk_portal always;
            include dev-web-headers.conf;
        }

        location /dataset/preview {
            rewrite /dataset/preview(.*) /preview$1 break;
            proxy_pass http://fdk-dataset-preview-service:8080;
            include dev-api-headers.conf;
        }

        location /events {
            if ($rdf_accept_type) {
                rewrite ^/events/([^/]+)$ /v1/events/$1/graph break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite ^/events/([^/]+)$ /v1/events/$1 break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            #portal
            proxy_pass http://fdk-portal:8080;
            add_header Content-Security-Policy $csp_policy_fdk_portal always;
            include dev-web-headers.conf;
        }

        location /information-models {
            location ~* /information-models/.* {
                if ($rdf_accept_type) {
                    rewrite ^/information-models/([^/]+)$ /v1/information-models/$1/graph break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($resource_accept_type) {
                    rewrite ^/information-models/([^/]+)$ /v1/information-models/$1 break;
                    proxy_pass http://fdk-resource-service:8080;
                    include dev-api-headers.conf;
                }
                if ($http_accept ~* "text/html") {
                    proxy_pass http://fdk-portal:8080;
                    add_header Content-Security-Policy $csp_policy_fdk_portal always;
                    include dev-web-headers.conf;
                }
            }
            if ($rdf_accept_type) {
                rewrite /information-models(.*) /v1/information-models$1/graph break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite /information-models(.*) /v1/information-models$1 break;
                proxy_pass http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            # Catalog root only. /information-models/{id} stays. /informationmodels
            # still aliases here first, so RDF on that alias keeps working.
            return 302 /nb/search/information-models$is_args$args;
        }

        location /ping {
            return 200;
        }

        location /public-services {
            if ($rdf_accept_type) {
                rewrite ^/public-services/([^/]+)$ /v1/public-services/$1/graph break;
                proxy_pass  http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            if ($resource_accept_type) {
                rewrite ^/public-services/([^/]+)$ /v1/public-services/$1 break;
                proxy_pass  http://fdk-resource-service:8080;
                include dev-api-headers.conf;
            }
            #portal
            proxy_pass http://fdk-portal:8080;
            add_header Content-Security-Policy $csp_policy_fdk_portal always;
            include dev-web-headers.conf;
        }

        location /ready {
            return 200;
        }

        location /reference-data {
             rewrite .+?(reference-data\/?)(.*) /reference-data/$2 break;
             proxy_pass http://reference-data:8080;
             include dev-api-headers.conf;
        }

        # Old portal search. Exact match so a further segment is not rewritten.
        location = /search {
            return 302 /nb/search$is_args$args;
        }

        location = /search-all {
            return 302 /nb/search$is_args$args;
        }

        location = /public-services-and-events {
            return 302 /nb/search/services-and-events$is_args$args;
        }

        location = /showroom {
            return 303 https://${host}/showroom/overview;
        }

        location ~* ^/(examples|specification|vocabulary|guide|licence|showroom) {
            proxy_pass http://static-rdf-nginx:8080;
            add_header Content-Security-Policy $csp_policy_static_rdf always;
            include dev-web-headers.conf;
        }

        location ~* /nlod/en/.+ {
            rewrite /nlod/en(.*) /licence/nlod$1 break;
            proxy_set_header Accept-language en;
            proxy_pass http://static-rdf-nginx:8080;
            add_header Content-Security-Policy $csp_policy_static_rdf always;
            include dev-web-headers.conf;
        }

        location /nlod/en {
            rewrite /nlod/en(.*) /licence/nlod break;
            proxy_set_header Accept-language en;
            proxy_pass http://static-rdf-nginx:8080;
            add_header Content-Security-Policy $csp_policy_static_rdf always;
            include dev-web-headers.conf;
        }

        location ~* /nlod/no/.+ {
            rewrite /nlod/no(.*) /licence/nlod$1 break;
            proxy_set_header Accept-language nb;
            proxy_pass http://static-rdf-nginx:8080;
            add_header Content-Security-Policy $csp_policy_static_rdf always;
            include dev-web-headers.conf;
        }

        location /nlod/no {
            rewrite /nlod/no(.*) /licence/nlod break;
            proxy_set_header Accept-language nb;
            proxy_pass http://static-rdf-nginx:8080;
            add_header Content-Security-Policy $csp_policy_static_rdf always;
            include dev-web-headers.conf;
        }

        location /nlod {
            rewrite /nlod(.*) /licence/nlod$1 break;
            proxy_set_header Accept-language nb;
            proxy_pass http://static-rdf-nginx:8080;
            add_header Content-Security-Policy $csp_policy_static_rdf always;
            include dev-web-headers.conf;
        }

        # Always data-norge-frontend (incl. transportportal): SPARQL, om-transportportal docs,
        # and /nb/_next assets (assetPrefix "/nb"). Must precede the catch-all below.
        location ~* ^(/nb/_next|(/(nb|nn|en))?/(sparql|om-transportportal)) {
            proxy_set_header X-Nonce $cspNonce;
            proxy_set_header Content-Security-Policy $csp_policy_data_norge;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass http://data-norge-frontend:8080;
            add_header Content-Security-Policy $csp_policy_data_norge always;
            include dev-web-headers.conf;
        }

        # Locale-prefixed catalog roots the catch-all would otherwise send to the
        # frontend. A further segment is a detail page and does not match.
        # /{lang}/concepts is not here: the app serves it and redirects details.
        location ~* ^/(nb|nn|en)/(information-models|informationmodels)$ {
            return 302 /$1/search/information-models$is_args$args;
        }

        location ~* ^/(nb|nn|en)/public-services-and-events$ {
            return 302 /$1/search/services-and-events$is_args$args;
        }

        # Locale-prefixed pages on every host, including transportportal. The app
        # reads the profile from X-Forwarded-Host. /organizations, /reports,
        # /requests, and /publishing stay on fdk-portal via location /.
        location ~* (^/(nb|nn|en)/?)|(^/?$)|(^/(?!about-registration/?$)(about|catalogs|contact|data-hunter|docs|validator|robots\.txt|sitemap\.xml|manifest\.json|favicon\.ico|icon\d\.(svg|png)|apple-icon\.png|web-app-manifest)) {
            location ~* (^/(nb|nn|en|robots\.txt|sitemap\.xml|manifest\.json|favicon\.ico|icon\d\.(svg|png)|apple-icon\.png|web-app-manifest)$)|(^/?$) {
                proxy_set_header X-Nonce $cspNonce;
                proxy_set_header Content-Security-Policy $csp_policy_data_norge;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $host;
                proxy_pass http://data-norge-frontend:8080;
                add_header Content-Security-Policy $csp_policy_data_norge always;
                include dev-web-headers.conf;
            }

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass http://data-norge-frontend:8080;
        }

        root /var/www/;

        error_page            502 @maintenance;
        error_page            503 @maintenance;
        location @maintenance {
           rewrite ^(.*)$     /http-error/maintenance.html break;
        }

        location /http-error/ {
          # Specifies that a given location can only be used for internal requests.
          # returns a 404 Not Found http error if accessed directly.
          internal;
        }

        location /undefined {
            return 404;
        }

        location / {
            if ($request_method ~* ^(POST|DELETE)$) {
                proxy_pass http://static-rdf-nginx:8080;
                include dev-api-headers.conf;
            }
            proxy_pass http://fdk-portal:8080;
            add_header Content-Security-Policy $csp_policy_fdk_portal always;
            include dev-web-headers.conf;
        }
    }
}
