---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdk-nginx-dataservices
  labels:
    fdk.service: fdk-nginx-dataservices
spec:
  replicas: 1
  selector:
    matchLabels:
      fdk.service: fdk-nginx-dataservices
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        fdk.service: fdk-nginx-dataservices
    spec:
      containers:
        - name: fdk-nginx-dataservices
          image: nginx:1.31.9-alpine
          env:
            - name: TZ
              value: Europe/Oslo
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 32Mi
              cpu: 1m
            limits:
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 5
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: config
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: fdk-nginx-dataservices
