---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdk-nginx-dataservices
  labels:
    fdk.service: fdk-nginx-dataservices
spec:
  replicas: 1
  selector:
    matchLabels:
      fdk.service: fdk-nginx-dataservices
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        fdk.service: fdk-nginx-dataservices
    spec:
      # The preStop sleep plus time for in-flight requests to finish.
      terminationGracePeriodSeconds: 45
      containers:
        - name: fdk-nginx-dataservices
          image: nginx:1.31.9-alpine
          # Keep accepting connections until the load balancer has removed the
          # endpoint from its NEG. nginx closes its listener as soon as it is
          # signalled, so connections still routed to the pod would be refused (503).
          lifecycle:
            preStop:
              sleep:
                seconds: 15
          env:
            - name: TZ
              value: Europe/Oslo
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 32Mi
              cpu: 1m
            limits:
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 5
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: config
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: fdk-nginx-dataservices
