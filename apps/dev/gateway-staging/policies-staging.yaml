# Cloud Armor, timeout, logging and health check per backend Service.
# Unlike Ingress, Gateway does not take the health check from the readiness
# probe. Policy names are substituted by Flux, as for the BackendConfigs.
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: catalog-comments-service-gateway
  namespace: staging
spec:
  default:
    logging:
      enabled: true
      sampleRate: 1000000
    securityPolicy: ${CLOUD_ARMOR_POLICY_SERVICES}
  targetRef:
    group: ""
    kind: Service
    name: catalog-comments-service-gateway
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: catalog-comments-service-gateway
  namespace: staging
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /ready
  targetRef:
    group: ""
    kind: Service
    name: catalog-comments-service-gateway
---
