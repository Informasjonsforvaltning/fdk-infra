# TLS for the Gateways, delivered from Secret Manager into the Gateway namespace.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stjerne-staging-fdk-digdir-no-tls
  namespace: gateway-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: stjerne-staging-fdk-digdir-no-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .privatekey }}"
  data:
    - secretKey: certificate
      remoteRef:
        key: stjerne-staging-fdk-digdir-no-tls-staging
        property: certificate
    - secretKey: privatekey
      remoteRef:
        key: stjerne-staging-fdk-digdir-no-tls-staging
        property: private-key
---
