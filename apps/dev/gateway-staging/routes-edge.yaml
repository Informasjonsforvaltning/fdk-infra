# Staging hosts behind the nginx edge today, now routed directly.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: access-request-api
  namespace: staging
spec:
  parentRefs:
    - name: staging-edge
      namespace: gateway-staging
      sectionName: https-staging
  hostnames:
    - access-request.api.staging.fellesdatakatalog.digdir.no
  rules:
    # ingress-nginx answers robots.txt for these hosts (server-snippet).
    - matches:
        - path:
            type: Exact
            value: /robots.txt
      backendRefs:
        - name: nginx-gateway
          namespace: nginx
          port: 80
    - backendRefs:
        - name: access-request-api
          port: 8080
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
---
