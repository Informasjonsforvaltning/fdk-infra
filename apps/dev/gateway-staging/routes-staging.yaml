# Hosts on the staging Ingress today (direct to the backends).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fdk-nginx-registration
  namespace: staging
spec:
  parentRefs:
    - name: staging
      namespace: gateway-staging
      sectionName: https
  hostnames:
    - registrering.staging.fellesdatakatalog.digdir.no
  rules:
    - backendRefs:
        - name: fdk-nginx-registration-gateway
          port: 8080
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
---
