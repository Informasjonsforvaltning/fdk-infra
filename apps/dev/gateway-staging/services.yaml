# Copies of app Services, with the same selector and ports, for routes whose
# original Service a Gateway rejects: most originals carry a BackendConfig
# annotation from the app repos. The fdk-nginx-* originals have none and are
# copied only to keep one pattern.
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-comments-service-gateway
  namespace: staging
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    fdk.service: catalog-comments-service
---
