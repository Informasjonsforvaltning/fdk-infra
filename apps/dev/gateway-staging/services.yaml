# A Service that a GKE Ingress uses cannot also back a Gateway, so the hosts
# on the staging Ingress get a copy with the same selector and ports (#310).
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-comments-service-gateway
  namespace: staging
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    fdk.service: catalog-comments-service
---
