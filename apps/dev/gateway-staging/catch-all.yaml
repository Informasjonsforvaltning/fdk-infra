# Hosts with no route of their own on the edge Gateway (demo, dev monitoring)
# go on to ingress-nginx, as they do from the edge Ingress today.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-catch-all
  namespace: nginx
spec:
  parentRefs:
    - name: staging-edge
      namespace: gateway-staging
      sectionName: https
  rules:
    - backendRefs:
        - name: nginx-gateway
          port: 80
      filters:
        # Same as the edge BackendConfig: GKE sends no X-Forwarded-Port, and
        # nginx would otherwise pass port 80 on to the apps.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Port
                value: "443"
---
# Lets the staging routes send robots.txt and ACME challenges to ingress-nginx.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: staging-routes
  namespace: nginx
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: staging
  to:
    - group: ""
      kind: Service
      name: nginx-gateway
