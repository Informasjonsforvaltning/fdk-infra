# Cloud Armor, logging and health check per backend Service. Gateway does not
# take the health check from the readiness probe.
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: access-request-api
  namespace: demo
spec:
  default:
    logging:
      enabled: true
      sampleRate: 1000000
    securityPolicy: ${CLOUD_ARMOR_POLICY_SERVICES}
  targetRef:
    group: ""
    kind: Service
    name: access-request-api
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: access-request-api
  namespace: demo
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /ready
  targetRef:
    group: ""
    kind: Service
    name: access-request-api
---
