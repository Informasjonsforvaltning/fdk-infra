# Demo hosts on the edge Gateway. ingress-nginx answers robots.txt, and the
# HTTP-01 challenges for auth and data-service-catalog.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: access-request-api
  namespace: demo
spec:
  parentRefs:
    - name: staging-edge
      namespace: gateway-staging
      sectionName: https-demo
  hostnames:
    - gw-access-request.api.demo.fellesdatakatalog.digdir.no
  rules:
    - matches:
        - path:
            type: Exact
            value: /robots.txt
      backendRefs:
        - name: nginx-gateway
          namespace: nginx
          port: 80
    - backendRefs:
        - name: access-request-api
          port: 8080
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
---
