# Demo hosts on the demo Gateway, routed directly to their backends.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fdk-nginx-registration
  namespace: demo
spec:
  parentRefs:
    - name: demo
      namespace: gateway-staging
      sectionName: https
  hostnames:
    - registrering.demo.fellesdatakatalog.digdir.no
  rules:
    - backendRefs:
        - name: fdk-nginx-registration-gateway
          port: 8080
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
---
apiVersion: gateway.networking.k8s.io/v1
