        - https://begrepskatalog.demo.fellesdatakatalog.digdir.no/
        - https://catalog-admin-service.demo.fellesdatakatalog.digdir.no/
        - https://catalog-admin.demo.fellesdatakatalog.digdir.no/
        - https://catalog-comments.demo.fellesdatakatalog.digdir.no/
        - https://catalog-history.demo.fellesdatakatalog.digdir.no/
        - https://catalog-portal.demo.fellesdatakatalog.digdir.no/
        - https://catalog-view.api.demo.fellesdatakatalog.digdir.no/
        - https://catalog.api.demo.fellesdatakatalog.digdir.no/
