# Prometheus discovers probe targets from Ingresses, not HTTPRoutes, so the
# demo hosts on the Gateways are listed here for the certificate alerts.
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: demo-hosts
  namespace: demo
  labels:
    # Required by the Prometheus probeSelector.
    release: monitoring-kube-prometheus-stack
spec:
  interval: 1m
  module: http_2xx
  prober:
    url: monitoring-blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://access-request.api.demo.fellesdatakatalog.digdir.no/
        - https://admin.demo.fellesdatakatalog.digdir.no/
        - https://aisearch.api.demo.fellesdatakatalog.digdir.no/
