# Keycloak serves only HTTPS, and the operator owns its Service, so the
# protocol is set here instead of with appProtocol.
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: keycloak-service
  namespace: demo
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: keycloak-service
      sectionName: https
  validation:
    hostname: auth.demo.fellesdatakatalog.digdir.no
    # Keycloak's certificate is issued by the internal CA, whose root
    # trust-manager publishes as the ConfigMap internal-ca.
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: internal-ca
