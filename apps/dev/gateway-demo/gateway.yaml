# Replaces the demo Ingress (ingress-demo-v4/v6).
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo
  namespace: gateway-staging
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: digdir-fdk-dev-demo-v4
    - type: NamedAddress
      value: digdir-fdk-dev-demo-v6
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: stjerne-demo-fdk-digdir-no-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: demo
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect-demo
  namespace: gateway-staging
spec:
  parentRefs:
    - name: demo
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Minimum TLS version (terraform/dev/ssl-policy.tf).
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: demo
  namespace: gateway-staging
spec:
  default:
    sslPolicy: digdir-fdk-dev-tls
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: demo
