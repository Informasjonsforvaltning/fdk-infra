apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/nginx-resource-identificators
  - config-map.yaml
  - ingress.yaml
patches:
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: staging
    target:
      kind: Deployment
      name: nginx-resource-identificators
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: staging
    target:
      kind: ConfigMap
      name: nginx-resource-identificators
  - patch: |-
      - op: add
        path: /metadata/namespace
        value: staging
    target:
      kind: Service
      name: nginx-resource-identificators
