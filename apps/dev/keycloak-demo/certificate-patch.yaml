apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-internal-tls
  namespace: demo
spec:
  # Only the Gateway connects to this certificate, and it trusts the internal
  # CA, so no public issuer is needed.
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
  usages:
    - server auth
    - digital signature
    - key encipherment
  dnsNames:
    - auth.demo.fellesdatakatalog.digdir.no
