apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: staging
spec:
  hostname:
    hostname: https://auth.staging.fellesdatakatalog.digdir.no
    # The admin console is served on localhost and reached with a
    # port-forward to keycloak-service on 8443.
    admin: https://localhost:8443
  instances: 3
  update:
    strategy: Explicit
    revision: "25"
  http:
    httpEnabled: false
    httpsPort: 8443
    tlsSecret: keycloak-internal-tls
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  ingress:
    enabled: false
  readinessProbe:
    periodSeconds: 20
    failureThreshold: 5
  livenessProbe:
    periodSeconds: 20
    failureThreshold: 5
  features:
    enabled:
      - admin-fine-grained-authz
      - ciba
      - client-auth-federated
      - organization
      - parameterized-scopes
      - recovery-codes
      - scripts
  additionalOptions:
    - name: db
      value: postgres
    - name: db-url-host
      secret:
        name: postgres
        key: HOST
    - name: db-url-port
      secret:
        name: postgres
        key: PORT
    - name: db-url-database
      secret:
        name: keycloak
        key: POSTGRESQL_DB
    - name: db-username
      secret:
        name: keycloak
        key: POSTGRESQL_USER
    - name: db-password
      secret:
        name: keycloak
        key: POSTGRESQL_PASSWORD
  env:
    - name: USER_API_KEY
      secret:
        name: common
        key: SSO_API_KEY
    - name: FDK_CLIENT_SECRET
      secret:
        name: keycloak
        key: FDK_CLIENT_SECRET
    - name: FDK_PORTAL_BASE_URI
      secret:
        name: keycloak
        key: FDK_PORTAL_BASE_URI
    - name: FDK_COMMUNITY_BASE_URI
      secret:
        name: commonurl
        key: FDK_COMMUNITY_BASE_URI
    - name: ADMIN_GUI_BASE_URI
      secret:
        name: commonurl
        key: ADMIN_GUI_BASE_URI
    - name: FDK_REGISTRATION_BASE_URI
      secret:
        name: commonurl
        key: FDK_REGISTRATION_BASE_URI
    # CVE-2026-114938 (Java4Shell): disable the vectorized Base64 decode intrinsic.
    # The unlock flag must appear before DisableIntrinsic. Remove once the bundled JDK carries JDK-8393212.
    - name: JAVA_OPTS_APPEND
      value: "-XX:+UnlockDiagnosticVMOptions -XX:DisableIntrinsic=_base64_decodeBlock"
