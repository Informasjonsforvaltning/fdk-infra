---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-resource-identificators-server
  namespace: demo
data:
  server.information-models.conf: |
    server {
      # Use the mapped $client_ip
      set_real_ip_from 10.0.0.0/8;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;
      listen                8080;
      server_name           information-models.demo.fellesdatakatalog.digdir.no;
      limit_req zone=identificator_limit burst=3 delay=1;

      if ($request_method != GET) {
        return 405;
      }

      # /<id> -> the information model graph in catalog-backend
      location ~ ^/[^/]+$ {
        rewrite ^/([^/]+)$ /graphs/information-models/$1 break;
        proxy_pass http://catalog-backend:8080;
      }

      location / {
        return 404;
      }
    }
  server.catalogs.conf: |
    server {
      # Use the mapped $client_ip
      set_real_ip_from 10.0.0.0/8;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;
      listen                8080;
      server_name           catalogs.demo.fellesdatakatalog.digdir.no;
      limit_req zone=identificator_limit burst=3 delay=1;

      if ($request_method != GET) {
        return 405;
      }

      # /<orgId>/information-models -> the organisation's information model catalog in catalog-backend
      location ~ ^/[^/]+/information-models$ {
        rewrite ^/([^/]+)/information-models$ /graphs/catalogs/$1/information-models break;
        proxy_pass http://catalog-backend:8080;
      }

      location / {
        return 404;
      }
    }
