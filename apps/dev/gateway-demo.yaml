---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-demo
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 10s
  path: ./apps/dev/gateway-demo
  # gateway-staging owns the listener and ReferenceGrant the routes use.
  dependsOn:
    - name: gateway-staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Supplies the Cloud Armor policy names; the Kustomization fails without it.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cloud-armor-backend-config
