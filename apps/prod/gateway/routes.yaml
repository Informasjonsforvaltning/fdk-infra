# Hosts that also have an ingress-nginx Ingress. The Gateway sends them
# straight to the app, and only robots.txt to ingress-nginx, which answers it
# for every host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: access-request-api
  namespace: prod
spec:
  parentRefs:
    - name: prod
      sectionName: https
  hostnames:
    - access-request.api.fellesdatakatalog.digdir.no
  rules:
    - matches:
        - path:
            type: Exact
            value: /robots.txt
      backendRefs:
        - name: prod-nginx-gateway
          port: 80
    - backendRefs:
        - name: access-request-api
          port: 8080
---
