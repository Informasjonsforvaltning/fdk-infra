# Hosts with no ingress-nginx Ingress, sent straight to their backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fdk-nginx-search
  namespace: prod
spec:
  parentRefs:
    - name: prod
      sectionName: https
  hostnames:
    - data.norge.no
    - www.data.norge.no
    - fellesdatakatalog.digdir.no
    - www.fellesdatakatalog.digdir.no
    - nap.fellesdatakatalog.digdir.no
    - transportportal.no
  rules:
    - backendRefs:
        - name: fdk-nginx-search-gateway
          port: 8080
---
