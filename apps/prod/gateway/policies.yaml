    name: fdk-statistics-service
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: prod-nginx-gateway
  namespace: prod
spec:
  default:
    logging:
      enabled: true
      sampleRate: 1000000
    securityPolicy: ${CLOUD_ARMOR_POLICY_NGINX_CONTROLLER}
  targetRef:
    group: ""
    kind: Service
    name: prod-nginx-gateway
